[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "provelume"
version = "0.5.0"
description = "Provenance-first personal knowledge intelligence"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Gabriele Falistocco" }]
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pypdf>=5,<7",
  "pyyaml>=6,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
provelume = "provelume.cli:main"
provelume-desktop = "provelume.desktop:main"

[tool.hatch.build]
reproducible = true

[tool.hatch.build.targets.wheel]
packages = ["core/provelume"]

[tool.pytest.ini_options]
pythonpath = ["core"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["provelume"]
