name: Reusable verified release publication

on:
  workflow_call:
    inputs:
      version:
        description: Verified package version.
        required: true
        type: string
      tag:
        description: Verified semantic release tag.
        required: true
        type: string
      channel:
        description: Verified release channel.
        required: true
        type: string
      commit:
        description: Exact public source commit verified by the assurance pipeline.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Attest and publish verified official release
    if: github.repository == 'gabned/provelume'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up verification Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.14"

      - name: Download verified release bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/provelume-verified-release"
          rm -rf "$release"
          mkdir -p "$release"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "provelume-verified-release-bundle-${GITHUB_RUN_ID}" \
            --dir "$release"

      - name: Reverify bundle before privilege use
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_commit="$(git rev-parse "${TAG}^{commit}")"
          if [ "$tag_commit" != "$SOURCE_COMMIT" ]; then
            echo '::error::Release tag does not resolve to the assured source commit.'
            exit 1
          fi
          python -m scripts.verify_release_bundle \
            --root "$RUNNER_TEMP/provelume-verified-release" \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit "$SOURCE_COMMIT"
          python "$RUNNER_TEMP/provelume-verified-release/verify-provelume-release.py" \
            --root "$RUNNER_TEMP/provelume-verified-release" \
            --expected-version "$VERSION" \
            --expected-tag "$TAG" \
            --expected-commit "$SOURCE_COMMIT" \
            --json >/dev/null

      - name: Attest wheel build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/provelume-verified-release/*.whl

      - name: Attest source distribution provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/provelume-verified-release/*.tar.gz

      - name: Attest release manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/provelume-verified-release/release-manifest.json

      - name: Attest release assurance and build evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/provelume-verified-release/release-assurance.json
            ${{ runner.temp }}/provelume-verified-release/deterministic-build-report.json
            ${{ runner.temp }}/provelume-verified-release/rebuild-deterministic-build-report.json
            ${{ runner.temp }}/provelume-verified-release/independent-rebuild-report.json
            ${{ runner.temp }}/provelume-verified-release/offline-rebuild-evidence.json
            ${{ runner.temp }}/provelume-verified-release/build-input-manifest.json
            ${{ runner.temp }}/provelume-verified-release/ubuntu-py312-x86_64.lock.json
            ${{ runner.temp }}/provelume-verified-release/ubuntu-py312-x86_64.requirements.txt
            ${{ runner.temp }}/provelume-verified-release/verify-provelume-release.py
            ${{ runner.temp }}/provelume-verified-release/SHA256SUMS

      - name: Attest wheel SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/provelume-verified-release/*.whl
          sbom-path: ${{ runner.temp }}/provelume-verified-release/provelume-${{ inputs.version }}.cdx.json

      - name: Publish GitHub Release without overwriting
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/provelume-verified-release"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo '::error::A GitHub Release already exists for this tag; refusing overwrite.'
            exit 1
          fi
          flags=()
          if [ "$CHANNEL" = "preview" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "$release"/* \
            --verify-tag \
            --title "Provelume ${VERSION}" \
            --generate-notes \
            "${flags[@]}"
