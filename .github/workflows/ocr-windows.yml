name: Concordia installed offline Windows OCR kit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_commit:
        type: string
        required: false
        default: ''
      candidate_artifact:
        type: string
        required: false
        default: ''
      package_artifact:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  installed-ocr:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      QUALIFIED_SHA: ${{ inputs.source_commit || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_commit || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.10'
      - name: Install development harness and locked image fixture generator
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r build-lock/sbom-runtime-pip.requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip bootstrap failed." }
          python -m pip install -e ".[dev]" -r requirements-release.txt
          if ($LASTEXITCODE -ne 0) { throw "Qualification harness install failed." }
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r build-lock/ocr-windows-py312-x86_64.requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "OCR locked fixture dependencies failed." }
      - name: Download the caller's exact qualified wheel and installer
        if: inputs.candidate_artifact != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          PACKAGE_ARTIFACT: ${{ inputs.package_artifact }}
        shell: pwsh
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:CANDIDATE_ARTIFACT --dir "$env:RUNNER_TEMP/ocr-candidate"
          if ($LASTEXITCODE -ne 0) { throw "Candidate artifact download failed." }
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:PACKAGE_ARTIFACT --dir "$env:RUNNER_TEMP/ocr-package"
          if ($LASTEXITCODE -ne 0) { throw "Installer artifact download failed." }
      - name: Acquire ordinary native inputs for standalone qualification
        if: inputs.candidate_artifact == ''
        shell: pwsh
        run: |
          python scripts/ai_runtime_acquire.py --directory "$env:RUNNER_TEMP/ocr-native" --platform all --accept-licenses
          if ($LASTEXITCODE -ne 0) { throw "Ordinary native input acquisition failed." }
          foreach ($target in @("windows", "linux")) {
            python scripts/build_ai_runtime_input.py --directory "$env:RUNNER_TEMP/ocr-native/$target" --platform $target --output "$env:RUNNER_TEMP/ocr-$target.zip"
            if ($LASTEXITCODE -ne 0) { throw "Ordinary native input verification failed." }
          }
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct $env:QUALIFIED_SHA
          python scripts/deterministic_build.py --commit $env:QUALIFIED_SHA --native-windows "$env:RUNNER_TEMP/ocr-windows.zip" --native-linux "$env:RUNNER_TEMP/ocr-linux.zip" --output-dir "$env:RUNNER_TEMP/ocr-candidate/dist" --evidence "$env:RUNNER_TEMP/ocr-build.json"
          if ($LASTEXITCODE -ne 0) { throw "Ordinary deterministic build failed." }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $wheel = Get-ChildItem "$env:RUNNER_TEMP/ocr-candidate/dist/*.whl" | Select-Object -First 1
          ./scripts/build_windows_installer.ps1 -CandidateWheel $wheel.FullName -OutputDirectory "$env:RUNNER_TEMP/ocr-package" -Version $version -Tag "v$version" -Channel development -Commit $env:QUALIFIED_SHA
      - name: Build pinned native engine and dedicated frozen OCR worker
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "$env:RUNNER_TEMP/ocr-candidate/dist/*.whl" | Select-Object -First 1
          ./scripts/build_windows_ocr_kit.ps1 -CandidateWheel $wheel.FullName -OutputDirectory "$env:RUNNER_TEMP/ocr-output" -Commit $env:QUALIFIED_SHA
      - name: Acquire the pinned disposable Gitea TLS server fixture
        shell: pwsh
        run: |
          python scripts/acquire_concordia_gitea_fixture.py --output "$env:RUNNER_TEMP/gitea-fixture/gitea.exe" > "$env:RUNNER_TEMP/ocr-output/gitea-input.json"
          if ($LASTEXITCODE -ne 0) { throw "Gitea fixture acquisition failed." }
      - name: Install that exact package, exercise offline kit and remove disposable installation
        shell: pwsh
        run: |
          $target = "$env:RUNNER_TEMP/Concordia OCR Installed"
          $setup = Get-ChildItem "$env:RUNNER_TEMP/ocr-package/Provelume-Setup-*.exe" | Select-Object -First 1
          $install = Start-Process -FilePath $setup.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$target`"", "/TASKS=`"`"") -PassThru
          if (-not $install.WaitForExit(90000) -or $install.ExitCode -ne 0) { throw "Disposable installation failed." }
          try {
            $kit = Get-ChildItem "$env:RUNNER_TEMP/ocr-output/provelume-*-ocr-windows-x64.zip" | Select-Object -First 1
            python scripts/qualify_windows_ocr_installed.py --executable "$target/Provelume.exe" --installer $setup.FullName --kit $kit.FullName --build-report "$env:RUNNER_TEMP/ocr-output/ocr-kit-build.json" --gitea-server "$env:RUNNER_TEMP/gitea-fixture/gitea.exe" --root "$env:RUNNER_TEMP/Concordia OCR Qualification" --output "$env:RUNNER_TEMP/ocr-output/windows-installed-ocr.json"
            if ($LASTEXITCODE -ne 0) { throw "Installed offline OCR qualification failed." }
          } finally {
            $uninstall = Start-Process -FilePath "$target/unins000.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -PassThru
            if (-not $uninstall.WaitForExit(90000) -or $uninstall.ExitCode -ne 0) { throw "Disposable uninstall failed." }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: provelume-ocr-windows-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ocr-output/
            ${{ runner.temp }}/ocr-build.json
          if-no-files-found: warn
          retention-days: 30
