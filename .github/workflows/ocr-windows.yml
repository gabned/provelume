name: Concordia installed offline Windows OCR kit
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_commit:
        type: string
        required: false
        default: ''
      candidate_artifact:
        type: string
        required: false
        default: ''
      package_artifact:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  rsync-linux-fixture:
    name: Build the exact-source synthetic Linux SSH fixture
    if: >-
      ${{
        !(
          github.event_name == 'pull_request'
          && github.event.pull_request.draft == true
          && github.repository == 'gabned/provelume'
          && github.event.pull_request.base.ref == 'main'
          && github.event.pull_request.head.repo.full_name == 'gabned/provelume'
          && github.event.pull_request.head.ref == 'codex/protocol-s07-finding-applicability'
          && github.event.pull_request.head.sha == 'f0b9445b2f5cd9f18ede776a311fe80e2bba799b'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.fixture.outputs.artifact-id }}
      producer_attempt: ${{ steps.build.outputs.producer_attempt }}
    env:
      QUALIFIED_SHA: ${{ inputs.source_commit || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_commit || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.14'
      - name: Build and record disposable fixture inputs
        id: build
        run: |
          python scripts/build_concordia_windows_fixture.py \
            --expected-head "$QUALIFIED_SHA" \
            --work "$RUNNER_TEMP/rsync-windows-build" \
            --bundle "$RUNNER_TEMP/rsync-windows-server"
          printf 'producer_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - id: fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: provelume-rsync-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rsync-windows-server/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: provelume-rsync-server-preparation-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rsync-windows-server/*-original.log
            ${{ runner.temp }}/rsync-windows-build/fixture/*-original.log
          if-no-files-found: warn
          retention-days: 30
  installed-ocr:
    needs: rsync-linux-fixture
    if: >-
      ${{
        !cancelled()
        && !(
          github.event_name == 'pull_request'
          && github.event.pull_request.draft == true
          && github.repository == 'gabned/provelume'
          && github.event.pull_request.base.ref == 'main'
          && github.event.pull_request.head.repo.full_name == 'gabned/provelume'
          && github.event.pull_request.head.ref == 'codex/protocol-s07-finding-applicability'
          && github.event.pull_request.head.sha == 'f0b9445b2f5cd9f18ede776a311fe80e2bba799b'
        )
      }}
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      QUALIFIED_SHA: ${{ inputs.source_commit || github.event.pull_request.head.sha || github.sha }}
      RSYNC_PRODUCER_ATTEMPT: ${{ needs.rsync-linux-fixture.outputs.producer_attempt }}
      RSYNC_ARTIFACT_ID: ${{ needs.rsync-linux-fixture.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_commit || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.10'
      - name: Install development harness and locked image fixture generator
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r build-lock/sbom-runtime-pip.requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip bootstrap failed." }
          python -m pip install -e ".[dev]" -r requirements-release.txt
          if ($LASTEXITCODE -ne 0) { throw "Qualification harness install failed." }
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r build-lock/ocr-windows-py312-x86_64.requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "OCR locked fixture dependencies failed." }
      - name: Acquire the pinned external Windows rsync qualification input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/ocr-output" | Out-Null
          python scripts/acquire_concordia_rsync_fixture.py --output "$env:RUNNER_TEMP/rsync-fixture" > "$env:RUNNER_TEMP/ocr-output/rsync-input.json"
          if ($LASTEXITCODE -ne 0) { throw "Rsync fixture acquisition failed." }
      - name: Qualify the source native rsync primitive before expensive package preparation
        shell: pwsh
        run: |
          $ssh = "$env:WINDIR/System32/OpenSSH/ssh.exe"
          if (Test-Path $ssh) { & $ssh -V }
          python -c "import sys; from pathlib import Path; from provelume.ocr_desktop import run_ocr_command; sys.exit(run_ocr_command(['rsync-windows-components-qualify', sys.argv[1], '--fixture-directory', sys.argv[2]], Path(sys.argv[3])))" "$env:RUNNER_TEMP/Source native Windows rsync" "$env:RUNNER_TEMP/rsync-fixture" "$env:RUNNER_TEMP/ocr-output/source-windows-rsync.json"
          Get-Content "$env:RUNNER_TEMP/ocr-output/source-windows-rsync.json"
          if ($LASTEXITCODE -ne 0) { throw "Source native rsync primitive failed; frozen qualification remains unperformed." }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        id: rsync-server-input
        if: needs.rsync-linux-fixture.result == 'success'
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.rsync-linux-fixture.outputs.artifact_id }}
          path: ${{ runner.temp }}/rsync-windows-server
      - name: Verify the pinned Microsoft Win32 OpenSSH qualification input
        id: rsync-ssh-input
        if: steps.rsync-server-input.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/acquire_concordia_windows_ssh_fixture.ps1 -OutputDirectory "$env:RUNNER_TEMP/rsync-ssh-client" -Evidence "$env:RUNNER_TEMP/ocr-output/rsync-ssh-input.json"
      - name: Qualify source native Windows SSH and rsync through the synthetic fixture
        id: rsync-source-wire
        if: steps.rsync-ssh-input.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/qualify_concordia_windows_rsync.py --head $env:QUALIFIED_SHA --bundle "$env:RUNNER_TEMP/rsync-windows-server" --components "$env:RUNNER_TEMP/rsync-fixture" --ssh-components "$env:RUNNER_TEMP/rsync-ssh-client" --work "$env:RUNNER_TEMP/source-windows-rsync-wire" --output "$env:RUNNER_TEMP/ocr-output/source-windows-rsync-wire"
          if ($LASTEXITCODE -ne 0) { throw "Source native Windows SSH/rsync qualification failed." }
      - name: Retain original closed source Windows SSH/rsync evidence
        if: ${{ !cancelled() && (steps.rsync-source-wire.outcome == 'success' || steps.rsync-source-wire.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: provelume-rsync-windows-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ocr-output/rsync-ssh-input.json
            ${{ runner.temp }}/ocr-output/source-windows-rsync-wire/*.json
            ${{ runner.temp }}/ocr-output/source-windows-rsync-wire/case-results-original.jsonl
          if-no-files-found: warn
          retention-days: 30
      - name: Download the caller's exact qualified wheel and installer
        if: inputs.candidate_artifact != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          PACKAGE_ARTIFACT: ${{ inputs.package_artifact }}
        shell: pwsh
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:CANDIDATE_ARTIFACT --dir "$env:RUNNER_TEMP/ocr-candidate"
          if ($LASTEXITCODE -ne 0) { throw "Candidate artifact download failed." }
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:PACKAGE_ARTIFACT --dir "$env:RUNNER_TEMP/ocr-package"
          if ($LASTEXITCODE -ne 0) { throw "Installer artifact download failed." }
      - name: Acquire ordinary native inputs for standalone qualification
        if: inputs.candidate_artifact == ''
        shell: pwsh
        run: |
          python scripts/ai_runtime_acquire.py --directory "$env:RUNNER_TEMP/ocr-native" --platform all --accept-licenses
          if ($LASTEXITCODE -ne 0) { throw "Ordinary native input acquisition failed." }
          foreach ($target in @("windows", "linux")) {
            python scripts/build_ai_runtime_input.py --directory "$env:RUNNER_TEMP/ocr-native/$target" --platform $target --output "$env:RUNNER_TEMP/ocr-$target.zip"
            if ($LASTEXITCODE -ne 0) { throw "Ordinary native input verification failed." }
          }
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct $env:QUALIFIED_SHA
          python scripts/deterministic_build.py --commit $env:QUALIFIED_SHA --native-windows "$env:RUNNER_TEMP/ocr-windows.zip" --native-linux "$env:RUNNER_TEMP/ocr-linux.zip" --output-dir "$env:RUNNER_TEMP/ocr-candidate/dist" --evidence "$env:RUNNER_TEMP/ocr-build.json"
          if ($LASTEXITCODE -ne 0) { throw "Ordinary deterministic build failed." }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $wheel = Get-ChildItem "$env:RUNNER_TEMP/ocr-candidate/dist/*.whl" | Select-Object -First 1
          ./scripts/build_windows_installer.ps1 -CandidateWheel $wheel.FullName -OutputDirectory "$env:RUNNER_TEMP/ocr-package" -Version $version -Tag "v$version" -Channel development -Commit $env:QUALIFIED_SHA
      - name: Build pinned native engine and dedicated frozen OCR worker
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "$env:RUNNER_TEMP/ocr-candidate/dist/*.whl" | Select-Object -First 1
          ./scripts/build_windows_ocr_kit.ps1 -CandidateWheel $wheel.FullName -OutputDirectory "$env:RUNNER_TEMP/ocr-output" -Commit $env:QUALIFIED_SHA
      - name: Acquire the pinned disposable Gitea TLS server fixture
        shell: pwsh
        run: |
          python scripts/acquire_concordia_gitea_fixture.py --output "$env:RUNNER_TEMP/gitea-fixture/gitea.exe" > "$env:RUNNER_TEMP/ocr-output/gitea-input.json"
          if ($LASTEXITCODE -ne 0) { throw "Gitea fixture acquisition failed." }
      - name: Install that exact package, exercise offline kit and remove disposable installation
        env:
          RSYNC_INPUT_READY: ${{ steps.rsync-ssh-input.outcome == 'success' }}
          RSYNC_SOURCE_READY: ${{ steps.rsync-source-wire.outcome == 'success' }}
        shell: pwsh
        run: |
          $target = "$env:RUNNER_TEMP/Concordia OCR Installed"
          $setup = Get-ChildItem "$env:RUNNER_TEMP/ocr-package/Provelume-Setup-*.exe" | Select-Object -First 1
          $install = Start-Process -FilePath $setup.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$target`"", "/TASKS=`"`"") -PassThru
          if (-not $install.WaitForExit(90000) -or $install.ExitCode -ne 0) { throw "Disposable installation failed." }
          try {
            $rsyncExit = 2
            if ($env:RSYNC_INPUT_READY -eq 'true') {
              python scripts/qualify_concordia_windows_rsync.py --head $env:QUALIFIED_SHA --bundle "$env:RUNNER_TEMP/rsync-windows-server" --components "$env:RUNNER_TEMP/rsync-fixture" --ssh-components "$env:RUNNER_TEMP/rsync-ssh-client" --work "$env:RUNNER_TEMP/installed-windows-rsync-wire" --output "$env:RUNNER_TEMP/ocr-output/installed-windows-rsync-wire" --executable "$target/Provelume.exe" --installer $setup.FullName
              $rsyncExit = $LASTEXITCODE
            }
            $kit = Get-ChildItem "$env:RUNNER_TEMP/ocr-output/provelume-*-ocr-windows-x64.zip" | Select-Object -First 1
            python scripts/qualify_windows_ocr_installed.py --executable "$target/Provelume.exe" --installer $setup.FullName --kit $kit.FullName --build-report "$env:RUNNER_TEMP/ocr-output/ocr-kit-build.json" --gitea-server "$env:RUNNER_TEMP/gitea-fixture/gitea.exe" --rsync-directory "$env:RUNNER_TEMP/rsync-fixture" --root "$env:RUNNER_TEMP/Concordia OCR Qualification" --output "$env:RUNNER_TEMP/ocr-output/windows-installed-ocr.json"
            if ($LASTEXITCODE -ne 0 -or $rsyncExit -ne 0 -or $env:RSYNC_SOURCE_READY -ne 'true') {
              throw "Installed offline OCR or independent source/installed Windows SSH/rsync qualification failed."
            }
          } finally {
            $uninstall = Start-Process -FilePath "$target/unins000.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -PassThru
            if (-not $uninstall.WaitForExit(90000) -or $uninstall.ExitCode -ne 0) { throw "Disposable uninstall failed." }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: provelume-ocr-windows-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ocr-output/
            ${{ runner.temp }}/ocr-build.json
          if-no-files-found: warn
          retention-days: 30
