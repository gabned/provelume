name: Cross-source qualification synthetic conformance smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-conformance:
    name: Synthetic conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out exact revision without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up CPython 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Bootstrap without provider credentials or runtime downloads
        run: python scripts/bootstrap.py

      - name: Run exact-head cross-source conformance on Linux
        if: runner.os == 'Linux'
        env:
          PROVELUME_QUALIFICATION_CONFORMANCE_SMOKE: "1"
        run: .venv/bin/python -m pytest -q tests/test_qualification_real_smoke.py

      - name: Run exact-head cross-source conformance on Windows
        if: runner.os == 'Windows'
        env:
          PROVELUME_QUALIFICATION_CONFORMANCE_SMOKE: "1"
        run: .venv\Scripts\python.exe -m pytest -q tests/test_qualification_real_smoke.py
