name: One-shot normalize installation verifier

on:
  push:
    branches:
      - feat/installed-core-integrity-verification

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/installed-core-integrity-verification

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Apply narrow correctness normalizations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          tests = Path("tests/test_installation_verification.py")
          text = tests.read_text(encoding="utf-8")
          text = text.replace(
              "def _rewrite_record(files: dict[str, Path], extra_rows: "
              "list[tuple[str, bytes | None]] = []) -> None:\n"
              "    rows = [\n",
              "def _rewrite_record(\n"
              "    files: dict[str, Path],\n"
              "    extra_rows: list[tuple[str, bytes | None]] | None = None,\n"
              ") -> None:\n"
              "    extra_rows = extra_rows or []\n"
              "    rows = [\n",
          )
          tests.write_text(text, encoding="utf-8")

          module = Path("core/provelume/installation_verification.py")
          text = module.read_text(encoding="utf-8")
          needle = (
              "    if not isinstance(commit, str) or not isinstance(release_version, str):\n"
              "        raise InstallationModifiedError(\n"
              "            \"verified release manifest identity is incomplete\"\n"
              "        )\n"
              "    return wheel, release_version, commit\n"
          )
          replacement = (
              "    if not isinstance(commit, str) or not isinstance(release_version, str):\n"
              "        raise InstallationModifiedError(\n"
              "            \"verified release manifest identity is incomplete\"\n"
              "        )\n"
              "    if release_version != version:\n"
              "        raise InstallationModifiedError(\n"
              "            \"release manifest version differs from the installed version\"\n"
              "        )\n"
              "    return wheel, release_version, commit\n"
          )
          if needle not in text:
              raise SystemExit("release-version patch target was not found")
          module.write_text(text.replace(needle, replacement), encoding="utf-8")
          PY

      - name: Install checks and normalize new files
        run: python -m pip install -e ".[dev]"

      - name: Fix and format new Python files
        run: |
          python -m ruff check --fix \
            core/provelume/installation_verification.py \
            scripts/verify_installation.py \
            tests/test_installation_verification.py
          python -m ruff format \
            core/provelume/installation_verification.py \
            scripts/verify_installation.py \
            tests/test_installation_verification.py

      - name: Verify branch
        run: |
          python -m ruff check core tests scripts
          python -m pytest -q

      - name: Remove one-shot workflow and push normalization
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-installation-normalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize installed Core verification"
          git push origin HEAD:feat/installed-core-integrity-verification
