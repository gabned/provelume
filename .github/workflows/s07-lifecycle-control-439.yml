name: S07 lifecycle window controls for PR 439
on:
  push:
    branches: ['codex/s07-lifecycle-control-439-20261111']
    paths: ['.github/workflows/s07-lifecycle-control-439.yml']
permissions:
  contents: read
jobs:
  model-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '19249382a1bb9bfbe5ce7d15d00e2ac70a21c3f2'
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.14'
      - name: Bind original S07 source and dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '19249382a1bb9bfbe5ce7d15d00e2ac70a21c3f2'
          test "$(git rev-parse HEAD:core/provelume/instance_lifecycle.py)" = c23d792d946a806f0156e38f69ae5b1617537110
          test "$(git rev-parse HEAD:scripts/ai_runtime_report.py)" = 67f72f2e493779daa38a1d97c263e60c5126cb45
          test -z "$(git status --porcelain)"
          git show -s --format='%H %T'
          python -m pip install -e '.[dev]'
      - name: Verify actual Capture phase discrimination without a model
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          cat > "$fixture/s07_lifecycle_window.py" <<'PY'
          """Observer prototype for the #439 lifecycle-entry hypothesis.

          Apply only in a disposable diagnostic process. No evaluator, wait policy,
          transaction, or underlying function is replaced by a substitute implementation.
          """

          from contextlib import contextmanager
          from contextvars import ContextVar
          from dataclasses import dataclass
          from threading import get_ident
          from time import monotonic_ns, thread_time_ns
          from unittest.mock import patch


          CAPTURE_PURPOSES = ("capture-submit", "capture-acquire")
          INDEX_PURPOSE = "search-index-refresh"
          PURPOSES = (*CAPTURE_PURPOSES, INDEX_PURPOSE)
          _ACTIVE_ENTRY = ContextVar("s07_lifecycle_window", default=None)


          def entry_purpose():
              """Identify the caller's currently observed pre-yield entry, if any."""
              row = _ACTIVE_ENTRY.get()
              return row.purpose if row is not None and row.caller == get_ident() else None


          @dataclass
          class Window:
              purpose: str
              caller: int
              entered: tuple[int, int]
              lock_acquired: tuple[int, int] | None = None
              ready: tuple[int, int] | None = None
              body_done: tuple[int, int] | None = None
              exited: tuple[int, int] | None = None
              lock_calls: int = 0

              def complete(self):
                  marks = (self.entered, self.lock_acquired, self.ready, self.body_done, self.exited)
                  return self.lock_calls == 1 and all(mark is not None for mark in marks) and all(
                      first[0] <= second[0] and first[1] <= second[1]
                      for first, second in zip(marks, marks[1:])
                  )


          @contextmanager
          def observe(lifecycle, *, clock=None):
              """Scope the observer to a caller running one declared original probe."""
              if clock is None:
                  def clock():
                      return monotonic_ns(), thread_time_ns()

              owner = get_ident()
              rows = []
              acquire = lifecycle._acquire_os_lock
              hold = lifecycle.InstanceLifecycleManager._hold

              def observed_acquire(descriptor):
                  row = _ACTIVE_ENTRY.get()
                  if row is None or row.caller != get_ident():
                      return acquire(descriptor)
                  row.lock_calls += 1
                  result = acquire(descriptor)
                  row.lock_acquired = clock()
                  return result

              @contextmanager
              def observed_hold(manager, *, purpose, wait_seconds=0):
                  if get_ident() != owner or purpose not in PURPOSES or _ACTIVE_ENTRY.get() is not None:
                      token = _ACTIVE_ENTRY.set(None)
                      try:
                          with hold(manager, purpose=purpose, wait_seconds=wait_seconds) as value:
                              yield value
                      finally:
                          _ACTIVE_ENTRY.reset(token)
                      return
                  row = Window(purpose=purpose, caller=owner, entered=clock())
                  token = _ACTIVE_ENTRY.set(row)
                  rows.append(row)
                  try:
                      with hold(manager, purpose=purpose, wait_seconds=wait_seconds) as value:
                          row.ready = clock()
                          # Do not count a lock acquired by the application body as entry.
                          _ACTIVE_ENTRY.reset(token)
                          token = None
                          try:
                              yield value
                          finally:
                              row.body_done = clock()
                  finally:
                      row.exited = clock()
                      if token is not None:
                          _ACTIVE_ENTRY.reset(token)

              with patch.object(lifecycle, "_acquire_os_lock", observed_acquire):
                  with patch.object(lifecycle.InstanceLifecycleManager, "_hold", observed_hold):
                      yield rows


          def summarize(rows, probe_start_ns, probe_end_ns, index_span):
              """Bind the three holds to the probe and the index hold to the index call."""
              if tuple(row.purpose for row in rows) != PURPOSES:
                  raise ValueError("unexpected Capture lifecycle calls")
              previous = probe_start_ns
              by_purpose = {}
              for row in rows:
                  if not row.complete() or not previous <= row.entered[0] <= row.exited[0] <= probe_end_ns:
                      raise ValueError("incomplete, overlapping, or unbound lifecycle window")
                  by_purpose[row.purpose] = {
                      "hold_wall_ns": row.exited[0] - row.entered[0],
                      "pre_yield_wall_ns": row.ready[0] - row.lock_acquired[0],
                      "pre_yield_thread_cpu_ns": row.ready[1] - row.lock_acquired[1],
                      "body_wall_ns": row.body_done[0] - row.ready[0],
                  }
                  previous = row.exited[0]
              index = rows[-1]
              start, end = index_span
              if not (
                  rows[1].exited[0] <= start[0] <= index.entered[0] <= index.exited[0] <= end[0] <= probe_end_ns
                  and start[1] <= index.entered[1] <= index.exited[1] <= end[1]
              ):
                  raise ValueError("search-index hold is not bound to its refresh call")
              return {
                  "by_purpose": by_purpose,
                  "capture_pre_yield_wall_ns": sum(
                      by_purpose[purpose]["pre_yield_wall_ns"] for purpose in CAPTURE_PURPOSES
                  ),
                  "search_index": {"wall_ns": end[0] - start[0], "thread_cpu_ns": end[1] - start[1]},
              }
          PY
          cat > "$fixture/control.py" <<'PY'
          """Model-free control for the lifecycle observer on the original Linux source."""

          import json
          import os
          import tempfile
          import time
          from collections import Counter
          from pathlib import Path
          from unittest.mock import patch

          from provelume import capture_adapter, capture_journal, instance_lifecycle
          from provelume.service import ProvelumeInstance
          from scripts.ai_runtime_report import deterministic_probe
          from s07_lifecycle_window import PURPOSES, entry_purpose, observe, summarize


          DELAY_NS = 120_000_000


          def clock():
              return time.monotonic_ns(), time.thread_time_ns()


          def run_case(instance, number, mode):
              original_recovery = capture_journal.recover_capture_transactions_locked
              original_body = capture_adapter.CaptureAdapter._acquire_locked
              original_index = capture_adapter.refresh_search_index
              recoveries = Counter()
              injected = []
              index_spans = []

              def inject():
                  start = time.monotonic_ns()
                  deadline = start + DELAY_NS
                  end = start
                  while end < deadline:
                      time.sleep((deadline - end) / 1e9)
                      end = time.monotonic_ns()
                  injected.append((start, end))

              def recovery(*args, **kwargs):
                  purpose = entry_purpose()
                  recoveries[purpose or "outside-observed-entry"] += 1
                  if mode == "recovery_delay" and purpose == "capture-acquire":
                      inject()
                  return original_recovery(*args, **kwargs)

              def body(*args, **kwargs):
                  if mode == "body_delay":
                      inject()
                  return original_body(*args, **kwargs)

              def index(*args, **kwargs):
                  start = clock()
                  try:
                      return original_index(*args, **kwargs)
                  finally:
                      index_spans.append((start, clock()))

              with (
                  patch.object(capture_journal, "recover_capture_transactions_locked", recovery),
                  patch.object(capture_adapter.CaptureAdapter, "_acquire_locked", body),
                  patch.object(capture_adapter, "refresh_search_index", index),
                  observe(instance_lifecycle, clock=clock) as rows,
              ):
                  start = time.monotonic_ns()
                  result = deterministic_probe(instance, number)
                  end = time.monotonic_ns()

              if len(index_spans) != 1 or any(recoveries[purpose] != 1 for purpose in PURPOSES):
                  raise ValueError(f"unexpected index or recovery calls: {len(index_spans)}, {dict(recoveries)}")
              summary = summarize(rows, start, end, index_spans[0])
              if not (result["preserved"] and result["search_found"] and result["product_dispatch_blocked"]):
                  raise ValueError("original Capture invariants did not pass")

              if mode == "unmodified":
                  if injected:
                      raise ValueError("the unmodified case injected a delay")
              else:
                  if len(injected) != 1:
                      raise ValueError("expected exactly one fixture delay")
                  left, right = injected[0]
                  process = rows[1]
                  lower, upper = (
                      (process.lock_acquired[0], process.ready[0])
                      if mode == "recovery_delay"
                      else (process.ready[0], process.body_done[0])
                  )
                  if not lower <= left <= right <= upper or right - left < DELAY_NS:
                      raise ValueError(f"{mode}: fixture delay was not isolated to the expected phase")
                  summary["injected_ns"] = right - left
              return {"mode": mode, "recovery_calls": dict(recoveries), **summary}


          def main():
              records = []
              with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as temporary:
                  for number, mode in enumerate(("unmodified", "recovery_delay", "body_delay")):
                      root = Path(temporary) / f"fixture-{number}" / "Synthetic Space"
                      records.append(run_case(ProvelumeInstance.initialise(root), number, mode))
              print(json.dumps({"status": "MODEL_FREE_WINDOW_CONTROLS_PASS", "rows": records}, sort_keys=True))


          if __name__ == "__main__":
              main()
          PY
          PYTHONPATH="$PWD:$fixture" python -B "$fixture/control.py"
          test -z "$(git status --porcelain)"
