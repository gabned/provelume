name: Local audio profile smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-whisper-cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build exact external whisper.cpp source
        shell: bash
        run: |
          set -euo pipefail
          git init .audio-whisper
          git -C .audio-whisper remote add origin https://github.com/ggml-org/whisper.cpp.git
          git -C .audio-whisper fetch --depth 1 origin 306c88f4d1286aec1bf96e544632897886af5501
          git -C .audio-whisper checkout --detach FETCH_HEAD
          test "$(git -C .audio-whisper rev-parse HEAD)" = "306c88f4d1286aec1bf96e544632897886af5501"
          cmake -S .audio-whisper -B .audio-whisper/build \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DGGML_NATIVE=OFF
          cmake --build .audio-whisper/build --config Release --target whisper-cli --parallel 2

      - name: Fetch and verify exact optional model for qualification only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output .audio-whisper/ggml-tiny-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/d148abaa5548d0deea3cf8075f0fd3376e483c8f/ggml-model-whisper-tiny-q5_1.bin
          echo '818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7  .audio-whisper/ggml-tiny-q5_1.bin' | sha256sum --check --strict
          test "$(stat --format=%s .audio-whisper/ggml-tiny-q5_1.bin)" = "32152673"

      - name: Bootstrap without runtime component downloads
        shell: bash
        run: python scripts/bootstrap.py

      - name: Run exact local engine smoke
        shell: bash
        run: |
          set -euo pipefail
          audio_binary="$(realpath .audio-whisper/build/bin/whisper-cli)"
          audio_model="$(realpath .audio-whisper/ggml-tiny-q5_1.bin)"
          audio_binary_sha="$(sha256sum "$audio_binary" | cut -d' ' -f1)"
          PROVELUME_REAL_AUDIO=1 \
          PROVELUME_WHISPER_CPP_PATH="$audio_binary" \
          PROVELUME_WHISPER_CPP_VERSION=1.9.2 \
          PROVELUME_WHISPER_CPP_SHA256="$audio_binary_sha" \
          PROVELUME_WHISPER_MODEL_PATH="$audio_model" \
            .venv/bin/python -m pytest -q tests/test_audio_real_smoke.py

  windows-degraded:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Bootstrap without audio component downloads
        run: python scripts/bootstrap.py

      - name: Prove bounded core and truthful missing-component state
        run: >-
          .venv\Scripts\python.exe -m pytest -q
          tests/test_audio_profiles.py
          tests/test_audio_real_smoke.py
