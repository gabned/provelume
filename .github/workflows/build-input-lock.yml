name: Reviewed build-input lock

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lock:
    name: Verify lock and build offline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up target Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            build-lock/ubuntu-py312-x86_64.requirements.txt

      - name: Download only the reviewed wheel identities
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/provelume-reviewed-build-inputs"
          rm -rf "$wheelhouse"
          mkdir -p "$wheelhouse"
          python -m pip download \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            --require-hashes \
            --dest "$wheelhouse" \
            -r build-lock/ubuntu-py312-x86_64.requirements.txt
          python -m scripts.build_input_lock verify \
            --wheelhouse "$wheelhouse" \
            --direct-requirements requirements-build.txt \
            --json-lock build-lock/ubuntu-py312-x86_64.lock.json \
            --requirements-lock build-lock/ubuntu-py312-x86_64.requirements.txt

      - name: Install build tooling without package-index access
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/provelume-reviewed-build-inputs"
          environment="$RUNNER_TEMP/provelume-reviewed-build-env"
          rm -rf "$environment"
          python -m venv "$environment"
          PIP_NO_INDEX=1 PIP_FIND_LINKS="$wheelhouse" \
            "$environment/bin/python" -m pip install \
              --disable-pip-version-check \
              --no-deps \
              --require-hashes \
              -r build-lock/ubuntu-py312-x86_64.requirements.txt

      - name: Build twice from the reviewed offline lock
        shell: bash
        run: |
          set -euo pipefail
          environment="$RUNNER_TEMP/provelume-reviewed-build-env"
          output="$RUNNER_TEMP/provelume-reviewed-build"
          rm -rf "$output"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          PIP_NO_INDEX=1 "$environment/bin/python" -m scripts.deterministic_build \
            --commit "$GITHUB_SHA" \
            --output-dir "$output/dist" \
            --report "$output/deterministic-build-report.json"
          "$environment/bin/python" -m json.tool \
            "$output/deterministic-build-report.json" >/dev/null
