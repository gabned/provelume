name: Official release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  assure:
    name: Build, rebuild and verify official release
    uses: ./.github/workflows/release-pipeline.yml
    with:
      publish: true
      expected_tag: ${{ github.ref_name }}
    permissions:
      contents: read
      actions: read

  publish:
    name: Publish only the verified bundle
    needs: assure
    uses: ./.github/workflows/release-publish.yml
    with:
      version: ${{ needs.assure.outputs.version }}
      tag: ${{ needs.assure.outputs.tag }}
      channel: ${{ needs.assure.outputs.channel }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
