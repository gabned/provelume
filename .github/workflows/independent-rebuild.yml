name: Independent Python package rebuild

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Build candidate package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
            requirements-release.txt

      - name: Install controlled build inputs
        run: |
          python -m pip install -e ".[dev]" \
            -r requirements-build.txt \
            -r requirements-release.txt

      - name: Resolve source epoch from checked-out commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Build candidate twice
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/provelume-candidate"
          rm -rf "$root"
          python scripts/deterministic_build.py \
            --commit "$GITHUB_SHA" \
            --output-dir "$root/dist" \
            --evidence "$root/deterministic-build-report.json"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: provelume-package-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/provelume-candidate/dist/
            ${{ runner.temp }}/provelume-candidate/deterministic-build-report.json
          if-no-files-found: error
          retention-days: 14

  independent-rebuild:
    name: Rebuild on a separately provisioned runner
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout the same public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python independently
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
            requirements-release.txt

      - name: Install controlled build inputs independently
        run: |
          python -m pip install -e ".[dev]" \
            -r requirements-build.txt \
            -r requirements-release.txt

      - name: Resolve source epoch from checked-out commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Rebuild twice on the second runner
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/provelume-rebuild"
          rm -rf "$root"
          python scripts/deterministic_build.py \
            --commit "$GITHUB_SHA" \
            --output-dir "$root/dist" \
            --evidence "$root/deterministic-build-report.json"

      - name: Download candidate from this workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/provelume-downloaded-candidate"
          rm -rf "$target"
          mkdir -p "$target"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "provelume-package-candidate-${GITHUB_SHA}" \
            --dir "$target"

      - name: Compare candidate and independent rebuild bytes
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/provelume-downloaded-candidate"
          rebuild="$RUNNER_TEMP/provelume-rebuild"
          python scripts/independent_rebuild.py \
            --candidate-dir "$candidate/dist" \
            --rebuild-dir "$rebuild/dist" \
            --candidate-report "$candidate/deterministic-build-report.json" \
            --rebuild-report "$rebuild/deterministic-build-report.json" \
            --output-report "$rebuild/independent-rebuild-report.json" \
            --commit "$GITHUB_SHA"

      - name: Upload independent rebuild evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: provelume-independent-rebuild-${{ github.sha }}
          path: ${{ runner.temp }}/provelume-rebuild/independent-rebuild-report.json
          if-no-files-found: error
          retention-days: 14
