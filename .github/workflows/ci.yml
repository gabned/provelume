name: Public repository CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  clean-room:
    name: Clean-room and repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject runtime secrets and private reference artifacts
        shell: bash
        run: |
          set -euo pipefail

          tracked_env="$({ git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; } || true)"
          if [ -n "$tracked_env" ]; then
            echo '::error::Runtime .env files are tracked.'
            printf '%s\n' "$tracked_env"
            exit 1
          fi

          forbidden_paths="$({ git ls-files | grep -Ei '(^|/)(\.nexus-analysis|Nexus-private|private-reference|Inbox)(/|$)'; } || true)"
          if [ -n "$forbidden_paths" ]; then
            echo '::error::Private reference-instance material is tracked.'
            printf '%s\n' "$forbidden_paths"
            exit 1
          fi

          required=(README.md LICENSE COMMERCIAL-LICENSE.md docs/clean-room.md docs/architecture/core-instance-boundary.md)
          for path in "${required[@]}"; do
            test -s "$path" || { echo "::error file=$path::Missing required public boundary file."; exit 1; }
          done

      - name: Reject obvious credential files
        shell: bash
        run: |
          set -euo pipefail
          suspicious="$({ git ls-files | grep -Ei '(^|/)(id_rsa|id_ed25519|credentials\.json|service-account.*\.json|.*\.(p12|pfx|key|pem))$'; } || true)"
          if [ -n "$suspicious" ]; then
            echo '::error::Potential credential material is tracked.'
            printf '%s\n' "$suspicious"
            exit 1
          fi

  core-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development checks
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check core tests scripts

      - name: Test
        run: python -m pytest -q

  release-foundation:
    name: Deterministic release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-release.txt

      - name: Derive reproducible source timestamp
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: Install release tooling
        run: python -m pip install -e ".[dev]" -r requirements-release.txt

      - name: Build and compare independent source copies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist release .release-runtime
          python scripts/deterministic_build.py \
            --source . \
            --output-dir dist \
            --evidence release/build-determinism.json \
            --commit "$GITHUB_SHA"

      - name: Install built wheel in clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .release-runtime
          .release-runtime/bin/python -m pip install --upgrade pip
          .release-runtime/bin/python -m pip install dist/*.whl
          .release-runtime/bin/provelume --help >/dev/null

      - name: Generate and validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          cyclonedx-py environment \
            --output-reproducible \
            --output-format JSON \
            --spec-version 1.6 \
            --pyproject pyproject.toml \
            --mc-type application \
            --output-file "release/provelume-${VERSION}.cdx.json" \
            .release-runtime/bin/python
          cp dist/*.whl dist/*.tar.gz release/
          cp LICENSE COMMERCIAL-LICENSE.md THIRD_PARTY_NOTICES.md release/
          export PROVELUME_BUILD_TIMESTAMP="2026-01-01T00:00:00+00:00"
          python scripts/release_manifest.py \
            --version "$VERSION" \
            --tag "v${VERSION}" \
            --commit "$GITHUB_SHA" \
            --channel development \
            --artifact release/*.whl \
            --artifact release/*.tar.gz \
            --artifact release/LICENSE \
            --artifact release/COMMERCIAL-LICENSE.md \
            --artifact release/THIRD_PARTY_NOTICES.md \
            --artifact release/build-determinism.json \
            --sbom "release/provelume-${VERSION}.cdx.json" \
            --manifest release/release-manifest.json \
            --checksums release/SHA256SUMS
          python -m json.tool release/release-manifest.json >/dev/null
          python -m json.tool "release/provelume-${VERSION}.cdx.json" >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('release/release-manifest.json').read_text())
          evidence = json.loads(Path('release/build-determinism.json').read_text())
          assert manifest['source_repository'] == 'gabned/provelume'
          assert manifest['channel'] == 'development'
          assert len(manifest['artifacts']) >= 6
          assert evidence['assurance'] == 'same-source-same-environment-byte-identical'
          assert evidence['full_release_reproducibility_claimed'] is False
          assert all(row['byte_identical'] for row in evidence['artifacts'])
          assert Path('release/SHA256SUMS').stat().st_size > 0
          PY
