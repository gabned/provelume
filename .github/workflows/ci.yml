name: Public repository guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  clean-room:
    name: Clean-room and repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject runtime secrets and private reference artifacts
        shell: bash
        run: |
          set -euo pipefail

          tracked_env="$({ git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; } || true)"
          if [ -n "$tracked_env" ]; then
            echo '::error::Runtime .env files are tracked.'
            printf '%s\n' "$tracked_env"
            exit 1
          fi

          forbidden_paths="$({ git ls-files | grep -Ei '(^|/)(\.nexus-analysis|Nexus-private|private-reference|Inbox)(/|$)'; } || true)"
          if [ -n "$forbidden_paths" ]; then
            echo '::error::Private reference-instance material is tracked.'
            printf '%s\n' "$forbidden_paths"
            exit 1
          fi

          required=(README.md LICENSE COMMERCIAL-LICENSE.md docs/clean-room.md docs/architecture/core-instance-boundary.md)
          for path in "${required[@]}"; do
            test -s "$path" || { echo "::error file=$path::Missing required public boundary file."; exit 1; }
          done

      - name: Reject obvious credential files
        shell: bash
        run: |
          set -euo pipefail
          suspicious="$({ git ls-files | grep -Ei '(^|/)(id_rsa|id_ed25519|credentials\.json|service-account.*\.json|.*\.(p12|pfx|key|pem))$'; } || true)"
          if [ -n "$suspicious" ]; then
            echo '::error::Potential credential material is tracked.'
            printf '%s\n' "$suspicious"
            exit 1
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo '### Provelume public guard'
            echo
            echo '- clean-room path checks: passed'
            echo '- runtime secret-file checks: passed'
            echo '- required public boundary documents: present'
          } >> "$GITHUB_STEP_SUMMARY"
