# Prospective Capture cost diagnostic; no candidate qualification authority.
# This replaces the EXISTING registered workflow only on diagnostic commit C.
# A/B contain instrumentation; B adds only the reviewed two-path fastpath delta.
# Fixed slot order does not assert chronological ordering across separate hosts.
name: Capture atomic single-task cost diagnostic (not qualification)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    name: capture-atomic-cost-${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - slot: A1
            ordinal: 0
            variant: original
            os: ubuntu-24.04
            code_sha: 4b1046428c31b1470fbb8a67a2673cb650d05679
          - slot: B1
            ordinal: 1
            variant: fastpath
            os: ubuntu-24.04
            code_sha: 162c225b96fd88237c58c93327a231db26b14766
          - slot: B2
            ordinal: 2
            variant: fastpath
            os: ubuntu-24.04
            code_sha: 162c225b96fd88237c58c93327a231db26b14766
          - slot: A2
            ordinal: 3
            variant: original
            os: ubuntu-24.04
            code_sha: 4b1046428c31b1470fbb8a67a2673cb650d05679
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Retain first shell boundary (not GitHub job start)
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          value = {"kind": "FIRST_STEP_START", "epoch_seconds": time.time(), "monotonic_seconds": time.monotonic(), "actual_github_job_started_at": "UNKNOWN_PENDING_ORIGINAL_API_OBSERVATION"}
          path = Path(os.environ["RUNNER_TEMP"]) / "capture-cost-first-step.json"
          with path.open("x") as stream:
              json.dump(value, stream, sort_keys=True)
              stream.write("\n")
          with Path(os.environ["GITHUB_ENV"]).open("a") as stream:
              stream.write("CAPTURE_FIRST_STEP_EPOCH=" + str(value["epoch_seconds"]) + "\n")
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ matrix.code_sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Retain exact source and frozen diagnostic plan
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = '${{ matrix.code_sha }}'
          CAPTURE_SOURCE_BEFORE=$(git status --porcelain --untracked-files=all)
          test -z "$CAPTURE_SOURCE_BEFORE"
          test "$(git rev-parse --is-shallow-repository)" = false
          CAPTURE_REPLACE_REFS=$(git for-each-ref refs/replace/)
          test -z "$CAPTURE_REPLACE_REFS"
          test "$(git show -s --format=%P 4b1046428c31b1470fbb8a67a2673cb650d05679)" = '7ec20fe0727a74a312235b53b52a5434707f4dc8'
          test "$(git show -s --format=%P 162c225b96fd88237c58c93327a231db26b14766)" = '4b1046428c31b1470fbb8a67a2673cb650d05679'
          test "$(git show -s --format=%P '${{ github.sha }}')" = '162c225b96fd88237c58c93327a231db26b14766'
          mkdir -p .agent/capture-cost-v1
          cp "${{ runner.temp }}/capture-cost-first-step.json" .agent/capture-cost-v1/first-step-start.json
          git show '${{ github.sha }}:scripts/capture_cost_v1_plan.json' > .agent/capture-cost-v1/frozen-plan.json
          printf '%s  %s\n' '17c27d65416645d1c8210fa0a1a13db47a3b4ea1ca1694a4387bbd6fdde98be6' '.agent/capture-cost-v1/frozen-plan.json' | sha256sum --check
          git show -s --format='%H%n%P%n%T' HEAD > .agent/capture-cost-v1/checkout-git-proof.txt
          git show -s --format='%H%n%P%n%T' '${{ github.sha }}' > .agent/capture-cost-v1/workflow-git-proof.txt
      - name: Canonical dependency bootstrap
        run: python scripts/bootstrap.py
      - name: Explicit locked acquisition (no model in artifacts or Git)
        run: .venv/bin/python scripts/ai_runtime_acquire.py --directory "${{ runner.temp }}/s05-inputs" --accept-licenses --include-model
      - name: Build locked native input with notices and SBOM, offline
        run: .venv/bin/python scripts/build_ai_runtime_input.py --directory "${{ runner.temp }}/s05-inputs/linux" --platform linux --output .agent/s05-native-input.zip
      - name: Complete ordinary real Linux path and declared appended diagnostic cohort
        shell: bash
        run: |
          set +e
          strace -ff -tt -e trace=network -o .agent/s05-network .venv/bin/python scripts/diagnose_capture_cost_v1.py --artifacts "${{ runner.temp }}/s05-inputs" --output .agent/s05-real.json --telemetry .agent/capture-cost-v1/telemetry.json --plan .agent/capture-cost-v1/frozen-plan.json --plan-sha256 17c27d65416645d1c8210fa0a1a13db47a3b4ea1ca1694a4387bbd6fdde98be6 --original-commit 4b1046428c31b1470fbb8a67a2673cb650d05679 --fast-commit 162c225b96fd88237c58c93327a231db26b14766 --cell-ordinal '${{ matrix.ordinal }}' --first-step-epoch "$CAPTURE_FIRST_STEP_EPOCH"
          measurement=$?
          printf '%s\n' "$measurement" > .agent/capture-cost-v1/entry-exit-code.txt
          if test ! -f .agent/s05-real.json; then
            if test "$measurement" -eq 0; then exit 1; fi
            exit "$measurement"
          fi
          .venv/bin/python scripts/ai_runtime_network.py --report .agent/s05-real.json --trace .agent/s05-network
          network=$?
          printf '%s\n' "$network" > .agent/capture-cost-v1/observer-exit-code.txt
          .venv/bin/python - <<'PY'
          import hashlib, json
          from datetime import UTC, datetime
          from pathlib import Path
          output = Path('.agent/capture-cost-v1/append-worker-trace-integrity.json')
          receipt = {'schema': 'diagnostic-appended-worker-trace-presence/v1', 'authority': 'NONE_NOT_QUALIFICATION', 'started_at': datetime.now(UTC).isoformat(), 'ordinary_report_modified': False, 'traces': [], 'result': 'REFUSED'}
          try:
              raw = Path('.agent/capture-cost-v1/telemetry.json').read_bytes()
              receipt['telemetry_sha256'] = hashlib.sha256(raw).hexdigest()
              value = json.loads(raw)
              if value.get('schema') != 'capture-cost-temporary-telemetry/v1':
                  raise ValueError('telemetry_schema')
              appended = value.get('appended_report')
              pids = appended.get('worker_pids') if isinstance(appended, dict) else None
              if not isinstance(pids, list) or not pids or any(type(pid) is not int or pid <= 0 for pid in pids):
                  raise ValueError('missing_or_invalid_appended_worker_pids')
              receipt['actual_appended_status'] = appended.get('status')
              receipt['worker_pids'] = pids
              for pid in sorted(set(pids)):
                  path = Path('.agent/s05-network.' + str(pid))
                  if path.is_symlink() or not path.is_file():
                      raise ValueError('appended_worker_trace_missing_or_not_regular')
                  trace = path.read_bytes()
                  receipt['traces'].append({'pid': pid, 'path': str(path), 'bytes': len(trace), 'sha256': hashlib.sha256(trace).hexdigest()})
              receipt['result'] = 'ORIGINAL_APPEND_WORKER_TRACE_FILES_PRESENT_NOT_QUALIFIED'
          except Exception as exc:
              receipt['exception_type'] = type(exc).__name__
              receipt['reason'] = str(exc) if type(exc) is ValueError else 'trace_presence_processing_error'
          receipt['completed_at'] = datetime.now(UTC).isoformat()
          with output.open('x') as stream:
              json.dump(receipt, stream, indent=2, sort_keys=True)
              stream.write('\n')
          raise SystemExit(0 if receipt['result'] == 'ORIGINAL_APPEND_WORKER_TRACE_FILES_PRESENT_NOT_QUALIFIED' else 1)
          PY
          appendix_trace_integrity=$?
          printf '%s\n' "$appendix_trace_integrity" > .agent/capture-cost-v1/append-trace-integrity-exit-code.txt
          git status --porcelain --untracked-files=all > .agent/capture-cost-v1/source-status-after.txt
          source_status_exit=$?
          test "$(git rev-parse HEAD)" = '${{ matrix.code_sha }}'
          source_head_integrity=$?
          test ! -s .agent/capture-cost-v1/source-status-after.txt
          source_tree_integrity=$?
          if test "$measurement" -ne 0; then exit "$measurement"; fi
          if test "$source_status_exit" -ne 0; then exit "$source_status_exit"; fi
          if test "$source_head_integrity" -ne 0; then exit "$source_head_integrity"; fi
          if test "$source_tree_integrity" -ne 0; then exit "$source_tree_integrity"; fi
          if test "$appendix_trace_integrity" -ne 0; then exit "$appendix_trace_integrity"; fi
          exit "$network"
      - name: Preserve first shell boundary after every outcome
        if: always()
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/.agent/capture-cost-v1"
          cp "$RUNNER_TEMP/capture-cost-first-step.json" "$GITHUB_WORKSPACE/.agent/capture-cost-v1/first-step-start.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: capture-atomic-cost-${{ matrix.slot }}-${{ matrix.variant }}
          path: |
            .agent/s05-real.json
            .agent/s05-network.*
            .agent/capture-cost-v1/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
