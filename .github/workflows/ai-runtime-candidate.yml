name: Custodia S05-S06 real CPU candidate and governed jobs
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      concordia_diagnostic:
        description: 'Nonqualifying S01 controlled main/original/candidate CPU replay'
        type: boolean
        default: false
      concordia_observer_study:
        description: 'Nonqualifying S01 operation-boundary and observer-cost study'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  measure:
    if: ${{ inputs.concordia_diagnostic != true && inputs.concordia_observer_study != true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Canonical dependency bootstrap
        run: python scripts/bootstrap.py
      - name: Explicit locked acquisition (no model in artifacts or Git)
        run: ${{ runner.os == 'Windows' && '.venv/Scripts/python.exe' || '.venv/bin/python' }} scripts/ai_runtime_acquire.py --directory "${{ runner.temp }}/s05-inputs" --accept-licenses --include-model
      - name: Build locked native input with notices and SBOM, offline
        run: ${{ runner.os == 'Windows' && '.venv/Scripts/python.exe' || '.venv/bin/python' }} scripts/build_ai_runtime_input.py --directory "${{ runner.temp }}/s05-inputs/${{ runner.os == 'Windows' && 'windows' || 'linux' }}" --platform ${{ runner.os == 'Windows' && 'windows' || 'linux' }} --output .agent/s05-native-input.zip
      - name: Real Linux execution with external syscall observation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          strace -ff -tt -e trace=network -o .agent/s05-network .venv/bin/python scripts/qualify_ai_runtime.py --artifacts "${{ runner.temp }}/s05-inputs" --output .agent/s05-real.json
          measurement=$?
          if test ! -f .agent/s05-real.json; then exit "$measurement"; fi
          .venv/bin/python scripts/ai_runtime_network.py --report .agent/s05-real.json --trace .agent/s05-network
      - name: Real Windows execution with disposable WFP control and audit
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/qualify_ai_runtime_windows.ps1 -Artifacts "${{ runner.temp }}/s05-inputs"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: s05-real-${{ matrix.os }}
          path: |
            .agent/s05-real.json
            .agent/s05-network.*
            .agent/s05-wfp.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  concordia-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.concordia_diagnostic == true && inputs.concordia_observer_study != true }}
    runs-on: ubuntu-24.04
    # Four diagnostic arms, capped at 20 minutes each; qualification job stays unchanged.
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Canonical dependency bootstrap
        run: python scripts/bootstrap.py
      - name: Explicit locked acquisition (no model in artifacts or Git)
        run: .venv/bin/python scripts/ai_runtime_acquire.py --directory "${{ runner.temp }}/concordia-inputs" --accept-licenses --include-model
      - name: Enable diagnostic scheduler counters
        run: sudo sysctl kernel.sched_schedstats=1
      - name: Controlled replay (DIAGNOSTIC_ONLY, never qualification)
        run: .venv/bin/python scripts/diagnose_concordia_cpu.py run --repository "$GITHUB_WORKSPACE" --inputs "${{ runner.temp }}/concordia-inputs" --output "$GITHUB_WORKSPACE/.agent/concordia-cpu-comparison"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: concordia-cpu-comparison
          path: .agent/concordia-cpu-comparison
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  concordia-observer-study:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.concordia_observer_study == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Canonical dependency bootstrap
        run: python scripts/bootstrap.py
      - name: Explicit locked acquisition (no model in artifacts or Git)
        run: .venv/bin/python scripts/ai_runtime_acquire.py --directory "${{ runner.temp }}/concordia-inputs" --accept-licenses --include-model
      - name: Enable diagnostic scheduler counters
        run: sudo sysctl kernel.sched_schedstats=1
      - name: Boundary counters and observer contrast (DIAGNOSTIC_ONLY)
        run: .venv/bin/python scripts/diagnose_concordia_cpu.py run --repository "$GITHUB_WORKSPACE" --inputs "${{ runner.temp }}/concordia-inputs" --output "$GITHUB_WORKSPACE/.agent/concordia-observer-study" --observer-study
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: concordia-observer-study
          path: .agent/concordia-observer-study
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
