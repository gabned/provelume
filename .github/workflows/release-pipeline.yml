name: Reusable release assurance pipeline

on:
  workflow_call:
    inputs:
      publish:
        description: Build official tag identity; false for dry-run validation.
        required: true
        type: boolean
      expected_tag:
        description: Official tag for publication; empty for dry-run validation.
        required: false
        default: ""
        type: string
      source_commit:
        description: Exact public source commit; defaults to the triggering commit.
        required: false
        default: ""
        type: string
    outputs:
      version:
        description: Verified package version.
        value: ${{ jobs.assemble.outputs.version }}
      tag:
        description: Verified semantic tag.
        value: ${{ jobs.assemble.outputs.tag }}
      channel:
        description: Verified release channel.
        value: ${{ jobs.assemble.outputs.channel }}
      commit:
        description: Verified public source commit.
        value: ${{ jobs.assemble.outputs.commit }}

env:
  SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}

permissions:
  contents: read

jobs:
  candidate:
    name: Build locked release candidate
    if: github.repository == 'gabned/provelume'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      channel: ${{ steps.identity.outputs.channel }}
      commit: ${{ steps.identity.outputs.commit }}

    steps:
      - name: Checkout public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up target Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
            requirements-release.txt
            build-lock/ubuntu-py312-x86_64.requirements.txt

      - name: Resolve release identity
        id: identity
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
          EXPECTED_TAG: ${{ inputs.expected_tag }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          publish = os.environ["PUBLISH"].casefold() == "true"
          commit = os.environ["SOURCE_COMMIT"]
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit(f"invalid full source commit: {commit}")
          if publish:
              tag = os.environ["EXPECTED_TAG"]
              if (
                  os.environ["SOURCE_REF_TYPE"] == "tag"
                  and tag != os.environ["GITHUB_REF_NAME"]
              ):
                  raise SystemExit("expected tag does not match the workflow ref")
              if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
                  raise SystemExit(f"invalid semantic release tag: {tag}")
              if tag != f"v{version}":
                  raise SystemExit(f"tag {tag} does not match package version {version}")
              channel = "preview" if version.startswith("0.") else "stable"
          else:
              tag = f"v{version}"
              channel = "development"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag={tag}\n")
              output.write(f"channel={channel}\n")
              output.write(f"commit={commit}\n")
          PY
          if [ "$PUBLISH" = "true" ]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main || {
              echo '::error::Official release tag must point to a commit on public main.'
              exit 1
            }
            git fetch --force origin \
              "refs/tags/${EXPECTED_TAG}:refs/tags/${EXPECTED_TAG}"
            tag_commit="$(git rev-parse "${EXPECTED_TAG}^{commit}")"
            if [ "$tag_commit" != "$SOURCE_COMMIT" ]; then
              echo '::error::Official release tag does not resolve to the selected source commit.'
              exit 1
            fi
          fi
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$SOURCE_COMMIT")" >> "$GITHUB_ENV"

      - name: Install read-only validation and release tooling
        run: python -m pip install -e ".[dev]" -r requirements-release.txt

      - name: Re-run source gates
        run: |
          python -m ruff check core tests scripts tools
          python -m pytest -q

      - name: Download and verify the reviewed build lock
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/provelume-release-candidate"
          rm -rf "$root"
          mkdir -p "$root/wheelhouse"
          python -m pip download \
            --disable-pip-version-check \
            --only-binary=:all: \
            --no-deps \
            --require-hashes \
            --dest "$root/wheelhouse" \
            -r build-lock/ubuntu-py312-x86_64.requirements.txt
          python -m scripts.build_input_lock verify \
            --wheelhouse "$root/wheelhouse" \
            --direct-requirements requirements-build.txt \
            --json-lock build-lock/ubuntu-py312-x86_64.lock.json \
            --requirements-lock build-lock/ubuntu-py312-x86_64.requirements.txt
          python -m scripts.build_input_bundle create \
            --wheelhouse "$root/wheelhouse" \
            --requirements requirements-build.txt \
            --output "$root/build-input-manifest.json" \
            --commit "$SOURCE_COMMIT"

      - name: Build candidate from reviewed offline inputs
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          TAG: ${{ steps.identity.outputs.tag }}
          CHANNEL: ${{ steps.identity.outputs.channel }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/provelume-release-candidate"
          python -m venv "$root/build-env"
          PIP_NO_INDEX=1 PIP_FIND_LINKS="$root/wheelhouse" \
            "$root/build-env/bin/python" -m pip install \
              --disable-pip-version-check \
              --no-deps \
              --require-hashes \
              -r build-lock/ubuntu-py312-x86_64.requirements.txt
          identity_args=(--channel development)
          if [ "$PUBLISH" = "true" ]; then
            identity_args=(--tag "$TAG" --channel "$CHANNEL" --official)
          fi
          PIP_NO_INDEX=1 "$root/build-env/bin/python" -m scripts.deterministic_build \
            --commit "$SOURCE_COMMIT" \
            --output-dir "$root/dist" \
            --evidence "$root/deterministic-build-report.json" \
            "${identity_args[@]}"
          shopt -s nullglob
          wheels=("$root"/dist/*.whl)
          sdists=("$root"/dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1 || { echo '::error::Expected one candidate wheel.'; exit 1; }
          test "${#sdists[@]}" -eq 1 || { echo '::error::Expected one candidate sdist.'; exit 1; }
          [[ "$(basename "${wheels[0]}")" == provelume-${VERSION}-* ]] || {
            echo '::error::Candidate wheel version mismatch.'
            exit 1
          }
          [[ "$(basename "${sdists[0]}")" == "provelume-${VERSION}.tar.gz" ]] || {
            echo '::error::Candidate source distribution version mismatch.'
            exit 1
          }
          export VERSION TAG CHANNEL PUBLISH
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lock = json.loads(
              Path("build-lock/ubuntu-py312-x86_64.lock.json").read_text()
          )
          payload = {
              "schema_version": 1,
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "source_date_epoch": int(os.environ["SOURCE_DATE_EPOCH"]),
              "version": os.environ["VERSION"],
              "tag": os.environ["TAG"],
              "channel": os.environ["CHANNEL"],
              "official": os.environ["PUBLISH"].casefold() == "true",
              "build_lock_id": lock["lock_id"],
          }
          root = Path(os.environ["RUNNER_TEMP"]) / "provelume-release-candidate"
          (root / "candidate-identity.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload release candidate evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: provelume-release-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/provelume-release-candidate/wheelhouse/
            ${{ runner.temp }}/provelume-release-candidate/dist/
            ${{ runner.temp }}/provelume-release-candidate/build-input-manifest.json
            ${{ runner.temp }}/provelume-release-candidate/deterministic-build-report.json
            ${{ runner.temp }}/provelume-release-candidate/candidate-identity.json
          if-no-files-found: error
          retention-days: 30

  offline-rebuild:
    name: Rebuild candidate offline on a second runner
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout the same public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up target Python independently
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.14"

      - name: Resolve source epoch from checked-out commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$SOURCE_COMMIT")" >> "$GITHUB_ENV"

      - name: Download candidate from this workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/provelume-release-downloaded-candidate"
          rm -rf "$target"
          mkdir -p "$target"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "provelume-release-candidate-${GITHUB_RUN_ID}" \
            --dir "$target"

      - name: Verify reviewed lock and transferred wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/provelume-release-downloaded-candidate"
          python -m scripts.build_input_lock verify \
            --wheelhouse "$target/wheelhouse" \
            --direct-requirements requirements-build.txt \
            --json-lock build-lock/ubuntu-py312-x86_64.lock.json \
            --requirements-lock build-lock/ubuntu-py312-x86_64.requirements.txt
          python -m scripts.build_input_bundle verify \
            --wheelhouse "$target/wheelhouse" \
            --requirements requirements-build.txt \
            --manifest "$target/build-input-manifest.json" \
            --commit "$SOURCE_COMMIT"

      - name: Install and rebuild without package-index access
        shell: bash
        env:
          TAG: ${{ needs.candidate.outputs.tag }}
          CHANNEL: ${{ needs.candidate.outputs.channel }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/provelume-release-downloaded-candidate"
          rebuild="$RUNNER_TEMP/provelume-release-rebuild"
          rm -rf "$rebuild"
          python -m venv "$rebuild/build-env"
          PIP_NO_INDEX=1 PIP_FIND_LINKS="$target/wheelhouse" \
            "$rebuild/build-env/bin/python" -m pip install \
              --disable-pip-version-check \
              --no-deps \
              --require-hashes \
              -r build-lock/ubuntu-py312-x86_64.requirements.txt
          identity_args=(--channel development)
          if [ "$PUBLISH" = "true" ]; then
            identity_args=(--tag "$TAG" --channel "$CHANNEL" --official)
          fi
          PIP_NO_INDEX=1 "$rebuild/build-env/bin/python" -m scripts.deterministic_build \
            --commit "$SOURCE_COMMIT" \
            --output-dir "$rebuild/dist" \
            --evidence "$rebuild/rebuild-deterministic-build-report.json" \
            "${identity_args[@]}"

      - name: Recompute and compare candidate/rebuild evidence
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/provelume-release-downloaded-candidate"
          rebuild="$RUNNER_TEMP/provelume-release-rebuild"
          python -m scripts.independent_rebuild \
            --candidate-dir "$target/dist" \
            --rebuild-dir "$rebuild/dist" \
            --candidate-report "$target/deterministic-build-report.json" \
            --rebuild-report "$rebuild/rebuild-deterministic-build-report.json" \
            --output-report "$rebuild/independent-rebuild-report.json" \
            --commit "$SOURCE_COMMIT"
          python -m scripts.offline_rebuild_evidence \
            --wheelhouse "$target/wheelhouse" \
            --requirements requirements-build.txt \
            --build-input-manifest "$target/build-input-manifest.json" \
            --independent-report "$rebuild/independent-rebuild-report.json" \
            --output "$rebuild/offline-rebuild-evidence.json" \
            --commit "$SOURCE_COMMIT"

      - name: Upload separate-runner rebuild evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: provelume-release-rebuild-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/provelume-release-rebuild/rebuild-deterministic-build-report.json
            ${{ runner.temp }}/provelume-release-rebuild/independent-rebuild-report.json
            ${{ runner.temp }}/provelume-release-rebuild/offline-rebuild-evidence.json
          if-no-files-found: error
          retention-days: 30

  windows-package:
    name: Build and exercise unsigned Windows preview
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout the assured public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Windows target Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build-lock/windows-py312-x86_64.requirements.txt

      - name: Download the assured candidate wheel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $target = "$env:RUNNER_TEMP\provelume-windows-candidate"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name "provelume-release-candidate-$env:GITHUB_RUN_ID" `
            --dir $target

      - name: Build installer and provider-independent update metadata
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "$env:RUNNER_TEMP\provelume-windows-candidate\dist\*.whl" | Select-Object -First 1
          ./scripts/build_windows_installer.ps1 `
            -CandidateWheel $wheel.FullName `
            -OutputDirectory "$env:RUNNER_TEMP\provelume-windows-output" `
            -Version "${{ needs.candidate.outputs.version }}" `
            -Tag "${{ needs.candidate.outputs.tag }}" `
            -Channel "${{ needs.candidate.outputs.channel }}" `
            -Commit "${{ needs.candidate.outputs.commit }}"

      - name: Exercise installed identity and preservation boundary
        shell: pwsh
        run: |
          ./scripts/test_windows_installer.ps1 `
            -Installer "$env:RUNNER_TEMP\provelume-windows-output\Provelume-Setup-${{ needs.candidate.outputs.version }}-x64.exe" `
            -InstallDirectory "$env:RUNNER_TEMP\Installed Provelume" `
            -InstanceDirectory "$env:RUNNER_TEMP\Portable Provelume Instance" `
            -ExpectedVersion "${{ needs.candidate.outputs.version }}" `
            -ExpectedCommit "${{ needs.candidate.outputs.commit }}" `
            -ExpectedChannel "${{ needs.candidate.outputs.channel }}"

      - name: Upload Windows package evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: provelume-windows-package-${{ github.run_id }}
          path: ${{ runner.temp }}/provelume-windows-output/
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble and verify release bundle
    needs: [candidate, offline-rebuild, windows-package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ needs.candidate.outputs.version }}
      tag: ${{ needs.candidate.outputs.tag }}
      channel: ${{ needs.candidate.outputs.channel }}
      commit: ${{ needs.candidate.outputs.commit }}

    steps:
      - name: Checkout public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up assembly Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements-release.txt

      - name: Install SBOM and manifest tooling
        run: python -m pip install -r requirements-release.txt

      - name: Download candidate and rebuild evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/provelume-release-assembly-candidate"
          evidence="$RUNNER_TEMP/provelume-release-assembly-evidence"
          rm -rf "$candidate" "$evidence"
          mkdir -p "$candidate" "$evidence"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "provelume-release-candidate-${GITHUB_RUN_ID}" \
            --dir "$candidate"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "provelume-release-rebuild-${GITHUB_RUN_ID}" \
            --dir "$evidence"
          windows="$RUNNER_TEMP/provelume-release-windows"
          rm -rf "$windows"
          mkdir -p "$windows"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "provelume-windows-package-${GITHUB_RUN_ID}" \
            --dir "$windows"

      - name: Verify complete assurance chain
        shell: bash
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          TAG: ${{ needs.candidate.outputs.tag }}
          CHANNEL: ${{ needs.candidate.outputs.channel }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/provelume-release-assembly-candidate"
          evidence="$RUNNER_TEMP/provelume-release-assembly-evidence"
          assembly="$RUNNER_TEMP/provelume-release-assembly"
          rm -rf "$assembly"
          mkdir -p "$assembly"
          python -m scripts.release_assurance \
            --candidate-dir "$candidate/dist" \
            --wheelhouse "$candidate/wheelhouse" \
            --direct-requirements requirements-build.txt \
            --json-lock build-lock/ubuntu-py312-x86_64.lock.json \
            --requirements-lock build-lock/ubuntu-py312-x86_64.requirements.txt \
            --build-input-manifest "$candidate/build-input-manifest.json" \
            --deterministic-report "$candidate/deterministic-build-report.json" \
            --independent-report "$evidence/independent-rebuild-report.json" \
            --offline-report "$evidence/offline-rebuild-evidence.json" \
            --output "$assembly/release-assurance.json" \
            --version "$VERSION" \
            --tag "$TAG" \
            --channel "$CHANNEL" \
            --commit "$SOURCE_COMMIT"

      - name: Install candidate wheel, verify identity and generate runtime SBOM
        shell: bash
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          TAG: ${{ needs.candidate.outputs.tag }}
          CHANNEL: ${{ needs.candidate.outputs.channel }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_COMMIT")"
          candidate="$RUNNER_TEMP/provelume-release-assembly-candidate"
          assembly="$RUNNER_TEMP/provelume-release-assembly"
          runtime="$RUNNER_TEMP/provelume-release-runtime"
          rm -rf "$runtime"
          python -m venv "$runtime"
          "$runtime/bin/python" -m pip install "$candidate"/dist/*.whl
          "$runtime/bin/provelume" --help >/dev/null
          "$runtime/bin/provelume" verify-installation \
            > "$assembly/installed-package-verification.json"
          "$runtime/bin/provelume" build-info > "$assembly/installed-build-info.json"
          export VERSION TAG CHANNEL PUBLISH
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "provelume-release-assembly"
          installation = json.loads(
              (root / "installed-package-verification.json").read_text()
          )
          assert installation["status"] == "package_integrity_verified", installation
          assert installation["network_used"] is False
          assert installation["origin"]["status"] == "not_established"
          value = json.loads((root / "installed-build-info.json").read_text())
          assert value["source_repository"] == "gabned/provelume"
          assert value["commit"] == os.environ["SOURCE_COMMIT"]
          assert value["source_date_epoch"] == int(os.environ["SOURCE_DATE_EPOCH"])
          assert value["verification"]["status"] == "not_performed"
          assert value["verification"]["network_used"] is False
          if os.environ["PUBLISH"].casefold() == "true":
              assert value["identity_status"] == "official_metadata_present"
              assert value["official"] is True
              assert value["tag"] == os.environ["TAG"]
              assert value["channel"] == os.environ["CHANNEL"]
          else:
              assert value["identity_status"] == "development_build"
              assert value["official"] is False
              assert value["tag"] is None
              assert value["channel"] == "development"
          PY
          rm \
            "$assembly/installed-build-info.json" \
            "$assembly/installed-package-verification.json"
          cyclonedx-py environment \
            --output-reproducible \
            --output-format JSON \
            --spec-version 1.6 \
            --pyproject pyproject.toml \
            --mc-type application \
            --output-file "$assembly/provelume-${VERSION}.cdx.json" \
            "$runtime/bin/python"
          export SBOM_PATH="$assembly/provelume-${VERSION}.cdx.json"
          export SBOM_IDENTITY="https://github.com/gabned/provelume/tree/${SOURCE_COMMIT}#v${VERSION}"
          python - <<'PY'
          import hashlib
          import json
          import os
          import uuid
          from pathlib import Path

          path = Path(os.environ["SBOM_PATH"])
          sbom = json.loads(path.read_text(encoding="utf-8"))
          if sbom.get("bomFormat") != "CycloneDX" or not sbom.get("specVersion"):
              raise SystemExit("cyclonedx-py did not produce a CycloneDX JSON BOM")
          sbom.pop("serialNumber", None)
          canonical = json.dumps(
              sbom, ensure_ascii=False, separators=(",", ":"), sort_keys=True
          ).encode("utf-8")
          fingerprint = hashlib.sha256(canonical).hexdigest()
          serial = uuid.uuid5(
              uuid.NAMESPACE_URL,
              f'{os.environ["SBOM_IDENTITY"]}:{fingerprint}',
          )
          sbom["serialNumber"] = f"urn:uuid:{serial}"
          path.write_text(
              json.dumps(sbom, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Assemble provider-independent manifest and checksums
        shell: bash
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          TAG: ${{ needs.candidate.outputs.tag }}
          CHANNEL: ${{ needs.candidate.outputs.channel }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/provelume-release-assembly-candidate"
          evidence="$RUNNER_TEMP/provelume-release-assembly-evidence"
          windows="$RUNNER_TEMP/provelume-release-windows"
          assembly="$RUNNER_TEMP/provelume-release-assembly"
          release="$RUNNER_TEMP/provelume-release-bundle"
          rm -rf "$release"
          mkdir -p "$release"
          cp "$candidate"/dist/*.whl "$candidate"/dist/*.tar.gz "$release"/
          cp LICENSE COMMERCIAL-LICENSE.md THIRD_PARTY_NOTICES.md "$release"/
          cp core/provelume/release_bundle.py "$release/verify-provelume-release.py"
          cp build-lock/ubuntu-py312-x86_64.lock.json "$release"/
          cp build-lock/ubuntu-py312-x86_64.requirements.txt "$release"/
          cp "$candidate/build-input-manifest.json" "$release"/
          cp "$candidate/deterministic-build-report.json" "$release"/
          cp "$candidate/candidate-identity.json" "$release"/
          cp "$evidence/rebuild-deterministic-build-report.json" "$release"/
          cp "$evidence/independent-rebuild-report.json" "$release"/
          cp "$evidence/offline-rebuild-evidence.json" "$release"/
          cp "$assembly/release-assurance.json" "$release"/
          cp "$assembly/provelume-${VERSION}.cdx.json" "$release"/
          cp "$windows"/Provelume-Setup-"${VERSION}"-x64.exe "$release"/
          cp "$windows"/provelume-windows-update.json "$release"/
          cp build-lock/windows-py312-x86_64.in "$release"/
          cp build-lock/windows-py312-x86_64.requirements.txt "$release"/
          if [ "$PUBLISH" = "true" ]; then
            export PROVELUME_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          else
            export PROVELUME_BUILD_TIMESTAMP="2026-01-01T00:00:00+00:00"
          fi
          python scripts/release_manifest.py \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit "$SOURCE_COMMIT" \
            --channel "$CHANNEL" \
            --artifact "$release"/*.whl \
            --artifact "$release"/*.tar.gz \
            --artifact "$release/LICENSE" \
            --artifact "$release/COMMERCIAL-LICENSE.md" \
            --artifact "$release/THIRD_PARTY_NOTICES.md" \
            --artifact "$release/verify-provelume-release.py" \
            --artifact "$release/ubuntu-py312-x86_64.lock.json" \
            --artifact "$release/ubuntu-py312-x86_64.requirements.txt" \
            --artifact "$release/build-input-manifest.json" \
            --artifact "$release/deterministic-build-report.json" \
            --artifact "$release/candidate-identity.json" \
            --artifact "$release/rebuild-deterministic-build-report.json" \
            --artifact "$release/independent-rebuild-report.json" \
            --artifact "$release/offline-rebuild-evidence.json" \
            --artifact "$release/release-assurance.json" \
            --artifact "$release/Provelume-Setup-${VERSION}-x64.exe" \
            --artifact "$release/provelume-windows-update.json" \
            --artifact "$release/windows-py312-x86_64.in" \
            --artifact "$release/windows-py312-x86_64.requirements.txt" \
            --sbom "$release/provelume-${VERSION}.cdx.json" \
            --manifest "$release/release-manifest.json" \
            --checksums "$release/SHA256SUMS"
          python -m scripts.verify_release_bundle \
            --root "$release" \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit "$SOURCE_COMMIT"
          python "$release/verify-provelume-release.py" \
            --root "$release" \
            --expected-version "$VERSION" \
            --expected-tag "$TAG" \
            --expected-commit "$SOURCE_COMMIT" \
            --json >/dev/null

      - name: Upload verified release bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: provelume-verified-release-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/provelume-release-bundle/
          if-no-files-found: error
          retention-days: 30
