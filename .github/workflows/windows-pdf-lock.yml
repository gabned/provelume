name: Windows PDF lock resolution
on:
  pull_request:
    paths:
      - 'build-lock/**'
      - 'scripts/resolve_windows_pdf_lock.py'
      - '.github/workflows/windows-pdf-lock.yml'
  push:
    branches: [main]
    paths:
      - 'build-lock/**'
      - 'scripts/resolve_windows_pdf_lock.py'
      - '.github/workflows/windows-pdf-lock.yml'
permissions:
  contents: read
jobs:
  resolve:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Resolve the PDF correction while preserving all other pins
        run: python scripts/resolve_windows_pdf_lock.py --output .agent/windows-pdf-lock
      - name: Verify the committed lock matches native Windows resolution
        run: >-
          python -c "from pathlib import Path;
          expected = Path('build-lock/windows-py312-x86_64.requirements.txt').read_text();
          actual = Path('.agent/windows-pdf-lock/windows-py312-x86_64.requirements.txt').read_text();
          assert expected == actual, 'Committed PDF lock differs from native Windows resolution'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-pdf-lock-${{ github.run_id }}
          path: .agent/windows-pdf-lock
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
