name: Custodia Windows telemetry capability probe (not qualification)
on:
  push:
    branches: [product/custodia-windows-phase-diagnosis]
    paths:
      - scripts/probe_custodia_windows_telemetry.ps1
      - .github/workflows/custodia-windows-diagnosis.yml
permissions:
  contents: read
jobs:
  capabilities:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Probe telemetry on this disposable guest without Core or model execution
        shell: pwsh
        run: ./scripts/probe_custodia_windows_telemetry.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: custodia-windows-telemetry-capabilities
          path: .agent/custodia-telemetry/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
