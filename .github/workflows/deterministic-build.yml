name: Deterministic Python distributions

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compare:
    name: Compare isolated Python builds
    if: github.repository == 'gabned/provelume'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up release Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Resolve and record build-input artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build-wheelhouse
          python -m pip download \
            --only-binary=:all: \
            --dest .build-wheelhouse \
            --requirement requirements-build.txt

      - name: Compare two isolated builds
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          python scripts/deterministic_build.py \
            --repository . \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --wheelhouse .build-wheelhouse \
            --requirements requirements-build.txt \
            --output-dir dist-deterministic \
            --report build-comparison.json

      - name: Validate comparison evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool build-comparison.json >/dev/null
          python -m json.tool build-comparison.schema.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build-comparison.json").read_text(encoding="utf-8"))
          assert report["source_repository"] == "gabned/provelume"
          assert report["result"] == "match"
          assert report["resolved_build_packages_match"] is True
          assert len(report["runs"]) == 2
          assert len(report["artifacts"]) == 2
          assert all(item["matches"] is True for item in report["artifacts"])
          assert len(list(Path("dist-deterministic").glob("*.whl"))) == 1
          assert len(list(Path("dist-deterministic").glob("*.tar.gz"))) == 1
          PY

      - name: Preserve deterministic-build evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deterministic-python-distributions
          path: |
            dist-deterministic/
            build-comparison.json
            build-comparison.schema.json
          if-no-files-found: error
          retention-days: 14
