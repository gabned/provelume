name: Apply 0.5.0 release unblock

on:
  push:
    branches:
      - product/0.5.0-release-unblock

permissions:
  contents: write

concurrency:
  group: apply-0-5-0-release-unblock
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout owner branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: product/0.5.0-release-unblock
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact public-baseline correction and regression
        shell: bash
        env:
          TEST_FILE_BASE64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          script_path = Path("scripts/test_windows_installer.ps1")
          text = script_path.read_text(encoding="utf-8")
          replacements = {
              "size = 18067909": "size = 18056957",
              "sha256 = \"d1ce3f855cb999f0063a4b08f826910c610891c6ba6c15254b16f2b42dabc4db\"": "sha256 = \"ea2093cd63860e2575715617f3bde363646213841f60be1db97433b19052b46b\"",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one stale baseline token: {old}")
              text = text.replace(old, new)
          script_path.write_text(text, encoding="utf-8")

          test_content = base64.b64decode(os.environ["TEST_FILE_BASE64"]).decode("utf-8")
          Path("tests/test_windows_public_baselines.py").write_text(
              test_content,
              encoding="utf-8",
          )
          Path(".github/workflows/apply-0-5-0-release-unblock.yml").unlink()
          PY

      - name: Commit final product delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Correct published 0.4.1 installer baseline'
          git push origin HEAD:product/0.5.0-release-unblock
