name: Windows group 0 temporary cleanup diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUFF_CACHE_DIR: .agent/ruff-cache

jobs:
  timing:
    name: Diagnostic timing for Windows Core group 0
    if: github.ref == 'refs/heads/codex/windows-group0-temp-20fb2d4' && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ccdb94d811d28ede7d6972be57306128bff4323c
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate source tree
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne 'ccdb94d811d28ede7d6972be57306128bff4323c' -or
              (git rev-parse 'HEAD^{tree}') -ne '95eb63daf19b3c98d5aa7adaf46868d331cfc295') {
            throw 'Diagnostic source identity mismatch'
          }

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development checks
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check core tests scripts tools packaging
      - name: Observe Windows JavaScript runtime before full shard execution
        shell: python
        run: |
          import json, shutil, subprocess, sys, time
          from pathlib import Path
          node = shutil.which("node")
          if node is None:
              raise SystemExit("Required browser-contract runtime is unavailable")
          version = subprocess.run([node, "--version"], capture_output=True, text=True, timeout=15, check=True)
          print(json.dumps({"node": node, "node_version": version.stdout.strip(), "python": sys.version}), flush=True)
          started = time.monotonic()
          result = subprocess.run([node, str(Path("tests/fixtures/cura_shell_contract.cjs").resolve()),
                                   str(Path("core/provelume/static/cura-shell.js").resolve())],
                                  stdin=subprocess.DEVNULL, capture_output=True, text=True, timeout=15, check=False)
          print(json.dumps({"exit": result.returncode, "seconds": time.monotonic()-started,
                            "stdout": result.stdout, "stderr": result.stderr}), flush=True)
          if result.returncode != 0 or "publication expiry contracts passed" not in result.stdout:
              raise SystemExit("Windows JavaScript contract failed before shard execution")

      - name: Execute two of four Windows shards within the unchanged deadline
        run: >-
          python tools/agent_protocol_work_check.py windows-group
          --root "${{ github.workspace }}"
          --output "${{ runner.temp }}/windows-core-0"
          --group 0 --commit "ccdb94d811d28ede7d6972be57306128bff4323c"
          --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}"
          --event "pull_request"
      - name: Retain exact-source Windows execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-windows-core-${{ github.run_id }}-${{ github.run_attempt }}-0
          path: |
            ${{ runner.temp }}/windows-core-0/*.json
            ${{ runner.temp }}/windows-core-0/*.log
            ${{ runner.temp }}/windows-core-0/shard-*/*.json
            ${{ runner.temp }}/windows-core-0/shard-*/*.log
          if-no-files-found: error
          retention-days: 14

      - name: Identify the first denied deletion in shard 1
        shell: python
        run: |
          import json
          import os
          import re
          import shutil
          import stat
          import time
          from pathlib import Path

          def emit(event, **fields):
              print(json.dumps({"event": event, **fields}, sort_keys=True), flush=True)

          def real_directory(path):
              info = path.lstat()
              if (not stat.S_ISDIR(info.st_mode)
                  or info.st_file_attributes & stat.FILE_ATTRIBUTE_REPARSE_POINT):
                  raise SystemExit("Unexpected diagnostic directory type")
              return path

          root = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          output = real_directory(root / "windows-core-0")
          shard = real_directory(output / "shard-1")
          target = real_directory(shard / "pytest-tmp")
          result = json.loads((output / "group-0.json").read_text(encoding="utf-8"))
          if (result["exit_code"] != 0 or result["group"] != 0 or result["timed_out"]
              or result["timeout_seconds"] != 540
              or result["identity"]["tree"] != "95eb63daf19b3c98d5aa7adaf46868d331cfc295"):
              raise SystemExit("Group did not finish successfully with the original controls")

          # Mirror the first probe and stop at its first error. Leave the failed
          # entry in place, with its attributes unchanged, for the native method.
          observed = None

          def stop_on_error(function, path, error):
              candidate = Path(path)
              relative = candidate.relative_to(target)
              if not candidate.resolve(strict=False).is_relative_to(target):
                  raise SystemExit("Unexpected deletion path")
              fields = {"operation": function.__name__,
                        "winerror": getattr(error, "winerror", None),
                        "errno": error.errno, "relative_depth": len(relative.parts)}
              # Only publish names fixed by known synthetic test fixtures.
              known_test = re.compile(r"test_(?:permission_only_postpubli|migration_preserves_windo|windows_canonical_config_)[a-z_]*\d+")
              if relative.parts and known_test.fullmatch(relative.parts[0]):
                  fields["fixture"] = relative.parts[0]
              if candidate.name in {"operator.txt", "provelume.yml"}:
                  fields["fixture_leaf"] = candidate.name
              try:
                  attrs = candidate.lstat().st_file_attributes
              except OSError as metadata_error:
                  fields["metadata_winerror"] = getattr(metadata_error, "winerror", None)
              else:
                  fields["read_only"] = bool(attrs & stat.FILE_ATTRIBUTE_READONLY)
                  fields["reparse_point"] = bool(attrs & stat.FILE_ATTRIBUTE_REPARSE_POINT)
                  fields["directory"] = bool(attrs & stat.FILE_ATTRIBUTE_DIRECTORY)
              emit("python_delete_error", **fields)
              raise error

          started = time.perf_counter()
          try:
              shutil.rmtree(target, onexc=stop_on_error)
          except PermissionError as error:
              if error.winerror != 5:
                  raise
              observed = error.winerror
          emit("python_delete_end", seconds=time.perf_counter() - started,
               winerror=observed, residual=target.exists())

      - name: Apply the active runner's native cleanup to the observed residual
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-PlainDirectory([string]$Path) {
            $item = Get-Item -LiteralPath $Path -Force
            if (-not $item.PSIsContainer -or
                ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Unexpected directory type' }
            return $item.FullName
          }
          $root = Assert-PlainDirectory ([IO.Path]::GetFullPath($env:RUNNER_TEMP))
          $group = Assert-PlainDirectory (Join-Path $root 'windows-core-0')
          $shard = Assert-PlainDirectory (Join-Path $group 'shard-1')
          $target = Join-Path $shard 'pytest-tmp'
          if (-not (Test-Path -LiteralPath $target)) {
            @{event='native_delete_not_needed'; reason='no Python deletion error'} | ConvertTo-Json -Compress
            exit 0
          }
          $target = Assert-PlainDirectory $target
          if ([IO.Path]::GetRelativePath($root, $target) -ne 'windows-core-0\shard-1\pytest-tmp') {
            throw 'Target outside the diagnostic directory'
          }

          $processId = $PID
          $worker = $null
          for ($depth = 0; $depth -lt 12 -and $processId; $depth++) {
            $process = Get-CimInstance Win32_Process -Filter "ProcessId=$processId"
            if ($process.Name -eq 'Runner.Worker.exe') { $worker = $process.ExecutablePath; break }
            $processId = $process.ParentProcessId
          }
          if (-not $worker) { throw 'Cannot identify the active GitHub runner worker' }
          $bin = [IO.Path]::GetDirectoryName($worker)
          $sdk = Join-Path $bin 'Runner.Sdk.dll'
          $assembly = [Reflection.Assembly]::LoadFrom($sdk)
          if ($assembly.Location -ne $sdk) { throw 'Runner cleanup assembly location mismatch' }
          $class = $assembly.GetType('GitHub.Runner.Sdk.IOUtil', $true)
          $method = $class.GetMethod('DeleteDirectory', [type[]]@([string], [bool], [bool], [Threading.CancellationToken]))
          if (-not $method) { throw 'Native runner cleanup signature missing' }
          @{
            event='native_method_bound'; assembly_sha256=(Get-FileHash -LiteralPath $sdk).Hash;
            worker_product_version=[Diagnostics.FileVersionInfo]::GetVersionInfo($worker).ProductVersion;
            framework=[Runtime.InteropServices.RuntimeInformation]::FrameworkDescription
          } | ConvertTo-Json -Compress
          $watch = [Diagnostics.Stopwatch]::StartNew()
          try {
            [void]$method.Invoke($null, [object[]]@($target, $true, $true, [Threading.CancellationToken]::None))
            $watch.Stop()
            $left = @(Get-ChildItem -Force -LiteralPath $target | Select-Object -First 1).Count -ne 0
            @{event='native_delete_end'; seconds=$watch.Elapsed.TotalSeconds; residual=$left} | ConvertTo-Json -Compress
            if ($left) { exit 1 }
          } catch {
            $watch.Stop()
            $errorInfo = $_.Exception.GetBaseException()
            @{event='native_delete_error'; seconds=$watch.Elapsed.TotalSeconds;
              kind=$errorInfo.GetType().Name; hresult=$errorInfo.HResult} | ConvertTo-Json -Compress
            exit 1
          }
