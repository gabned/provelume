name: Windows shell and configurable endpoint smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-shell:
    name: Exact-head Windows shell qualification
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PROVELUME_QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: pwsh
        run: |
          $observed = git rev-parse HEAD
          if (
            $env:PROVELUME_QUALIFIED_SHA -notmatch '^[0-9a-f]{40}$' -or
            $observed -ne $env:PROVELUME_QUALIFIED_SHA
          ) {
            throw "Checkout is not bound to the qualified candidate head."
          }

      - name: Initialize sanitized bounded evidence
        shell: pwsh
        run: |
          $directory = "$env:RUNNER_TEMP\s07-installer"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          [ordered]@{
            schema_version = 1
            status = "NOT_RUN"
            failure_code = "qualification_incomplete"
            exact_head = $env:PROVELUME_QUALIFIED_SHA
            checks = [ordered]@{}
            network_used_by_harness = $false
            private_content_logged = $false
          } | ConvertTo-Json -Depth 4 | Set-Content `
            -LiteralPath (Join-Path $directory "windows-shell-evidence.json") `
            -Encoding utf8NoBOM

      - name: Set up CPython 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-release.txt
            build-lock/windows-py312-x86_64.requirements.txt

      - name: Install reviewed development and packaging tools
        run: python -m pip install -e ".[dev]" -r requirements-release.txt

      - name: Verify source contracts and deterministic tray harness
        shell: pwsh
        run: |
          python scripts/generate_windows_icon.py --check
          python -m pytest -q `
            tests/test_shell_settings.py `
            tests/test_windows_identity.py `
            tests/test_desktop_about.py

      - name: Build exact-head development wheel
        shell: pwsh
        run: |
          $epoch = git show -s --format=%ct $env:PROVELUME_QUALIFIED_SHA
          $env:SOURCE_DATE_EPOCH = $epoch
          python scripts/deterministic_build.py `
            --commit $env:PROVELUME_QUALIFIED_SHA `
            --output-dir "$env:RUNNER_TEMP\s07-wheel" `
            --evidence "$env:RUNNER_TEMP\s07-build-evidence.json" `
            --channel development

      - name: Build frozen shell and unsigned development installer
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $wheel = Get-ChildItem "$env:RUNNER_TEMP\s07-wheel\*.whl" | Select-Object -First 1
          ./scripts/build_windows_installer.ps1 `
            -CandidateWheel $wheel.FullName `
            -OutputDirectory "$env:RUNNER_TEMP\s07-installer" `
            -Version $version `
            -Tag "v$version" `
            -Channel development `
            -Commit $env:PROVELUME_QUALIFIED_SHA

      - name: Exercise identity, endpoint, tray lifecycle and cleanup
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          ./scripts/test_windows_shell_smoke.ps1 `
            -Installer "$env:RUNNER_TEMP\s07-installer\Provelume-Setup-$version-x64.exe" `
            -InstallDirectory "$env:RUNNER_TEMP\S07 Installed Provelume" `
            -InstanceDirectory "$env:RUNNER_TEMP\S07 Synthetic Instance" `
            -ExpectedVersion $version `
            -ExpectedCommit $env:PROVELUME_QUALIFIED_SHA

      - name: Upload sanitized exact-head evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-shell-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/s07-installer/windows-shell-evidence.json
          if-no-files-found: error
          retention-days: 14
