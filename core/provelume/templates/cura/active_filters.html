{% if active_filters %}<ul class="cura-filter-chips" aria-label="{{ t('cura.active_filters') }}">{% for filter in active_filters %}<li><a href="{{ filter['clear'] }}" aria-label="{{ t('cura.remove_filter') }}: {{ t('cura.filter.' ~ filter.key) }} — {{ filter.value }}"><span>{{ t('cura.filter.' ~ filter.key) }}: {{ filter.value }}</span>{{ icon('x') }}</a></li>{% endfor %}</ul>{% endif %}
