<li class="empty">
  <p>{{ t('search.empty') }}</p>
  <dl class="technical-note">{% for filter in active_filters %}<dt>{{ t('cura.filter.' ~ filter.key) }}</dt><dd>{{ filter.value }}</dd>{% endfor %}</dl>
  <p><a id="search-edit" href="#search-query">{{ t('search.edit') }}</a></p>
  {% if search_has_filters %}<p><a id="search-remove-filters" href="{{ filter_link(source_id=none, media_type=none, date_from=none, date_to=none) }}">{{ t('search.remove_filters') }}</a></p>{% endif %}
</li>
